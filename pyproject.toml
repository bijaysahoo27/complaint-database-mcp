[project]
name = "my-project"
version = "0.1.5"
description = "Claude chatbot and MCP server for the PostgreSQL Complaint Database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.0.0",
    "langchain-mcp-adapters>=0.3.0",
    "langchain-openai>=1.0.0",
    "mcp[cli]>=1.12.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.2.0",
    "streamlit>=1.49.0",
]

[project.scripts]
complaint-db-mcp = "my_project:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
